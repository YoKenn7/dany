<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Galaxia de amor 🌻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
  :root{
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; height:100%; width:100%;
    background:#05040f;
    overflow:hidden;
    font-family:'Fredoka', sans-serif;
    -webkit-user-select:none; user-select:none;
    touch-action:none;
  }
  canvas#escena{ position:fixed; inset:0; display:block; }

  .capa-ui{
    position:fixed; inset:0;
    pointer-events:none;
    z-index: 5;
    display:flex; flex-direction:column; justify-content:space-between;
    padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
  }

  .titulo{
    text-align:center;
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size: clamp(1.8rem, 7vw, 2.4rem);
    color:#FFE9A8;
    text-shadow: 0 0 14px rgba(255,201,60,.7);
    opacity:0;
    transition: opacity 1.2s ease;
  }
  .titulo.mostrar{ opacity:1; }

  .pista{
    text-align:center;
    font-size:.82rem;
    color:#F3E6C9;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,211,92,.35);
    display:inline-block;
    margin: 0 auto;
    padding: 8px 18px;
    border-radius: 999px;
    backdrop-filter: blur(2px);
    opacity:0;
    transition: opacity 1s ease;
  }
  .pista.mostrar{ opacity:.9; }
  .pista.ocultar{ opacity:0; }

  .boton-musica{
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    right: 16px;
    z-index: 10;
    pointer-events: auto;
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(255,211,92,.4);
    background: rgba(10,8,20,.45);
    backdrop-filter: blur(3px);
    color: #FFE9A8;
    font-size: 1.1rem;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }

  #carga{
    position:fixed; inset:0; z-index: 20;
    background:#05040f;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px;
    transition: opacity .7s ease;
  }
  #carga.oculto{ opacity:0; pointer-events:none; }
  .flor-carga{
    width:52px; height:52px;
    border-radius:50%;
    border: 3px solid rgba(255,211,92,.25);
    border-top-color: #FFC93C;
    animation: girar 1s linear infinite;
  }
  @keyframes girar{ to{ transform: rotate(360deg); } }
  #carga p{
    color:#FFE9A8;
    font-family:'Caveat', cursive;
    font-size:1.3rem;
  }

  @media (prefers-reduced-motion: reduce){
    .flor-carga{ animation-duration: 2s; }
  }
</style>
</head>
<body>

<div id="carga">
  <div class="flor-carga"></div>
  <p>armando tu galaxia…</p>
</div>

<canvas id="escena"></canvas>

<button class="boton-musica" id="botonMusica" aria-label="Activar o silenciar música">🎵</button>

<div class="capa-ui">
  <div class="titulo" id="titulo">Feliz dia mi princesa 💛</div>
  <div class="pista" id="pista">arrastra para rotar · pellizca para acercar · toca el corazón ✨</div>
</div>

<script>
(function(){

  const canvas = document.getElementById('escena');
  const capaCarga = document.getElementById('carga');
  const elTitulo = document.getElementById('titulo');
  const elPista = document.getElementById('pista');
  const botonMusica = document.getElementById('botonMusica');

  /* ---------------------------------------------------
     Música de fondo: melodía original generada con Web Audio
     (tipo caja de música), sin archivos externos
     --------------------------------------------------- */
  let audioCtx = null, gainMaestro = null, temporizadorMusica = null;
  let musicaActiva = false, musicaSilenciada = false;

  // Si guardas un archivo "cancion.mp3" junto a este HTML, se usa esa canción;
  // si no existe, cae automáticamente en la melodía compuesta de respaldo
  const audioExterno = new Audio('cancion.mp3');
  audioExterno.loop = true;
  audioExterno.volume = 0.55;
  audioExterno.preload = 'auto';
  let usandoExterno = false;
  let yaProbeExterno = false;

  function actualizarBotonMusica(){
    botonMusica.textContent = musicaActiva ? '🔊' : '🔇';
  }

  function programarMusica(){
    const escala = [523.25,587.33,659.25,783.99,880.00,783.99,659.25,587.33];
    const bajo = [130.81,164.81,196.00,164.81];
    let paso = 0, pasoBajo = 0;
    const TIEMPO_NOTA = 0.62;
    let proximoTiempo = audioCtx.currentTime + 0.1;

    function tocarNota(freq, tiempo, duracion, volumen){
      const osc = audioCtx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const env = audioCtx.createGain();
      env.gain.setValueAtTime(0, tiempo);
      env.gain.linearRampToValueAtTime(volumen, tiempo+0.05);
      env.gain.exponentialRampToValueAtTime(0.0001, tiempo+duracion);
      osc.connect(env);
      env.connect(gainMaestro);
      osc.start(tiempo);
      osc.stop(tiempo+duracion+0.05);
    }

    function planificar(){
      while(proximoTiempo < audioCtx.currentTime + 1.2){
        tocarNota(escala[paso % escala.length], proximoTiempo, 0.95, 0.5);
        if(paso % 2 === 0){
          tocarNota(bajo[pasoBajo % bajo.length], proximoTiempo, 1.15, 0.26);
          pasoBajo++;
        }
        proximoTiempo += TIEMPO_NOTA;
        paso++;
      }
    }
    planificar();
    temporizadorMusica = setInterval(planificar, 350);
  }

  function iniciarMusicaSintetizada(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      gainMaestro = audioCtx.createGain();
      gainMaestro.gain.value = 0.16;
      gainMaestro.connect(audioCtx.destination);
      // eco suave, como caja de música
      const eco = audioCtx.createDelay();
      eco.delayTime.value = 0.34;
      const gananciaEco = audioCtx.createGain();
      gananciaEco.gain.value = 0.22;
      gainMaestro.connect(eco);
      eco.connect(gananciaEco);
      gananciaEco.connect(audioCtx.destination);
      programarMusica();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    usandoExterno = false;
    musicaActiva = true;
    actualizarBotonMusica();
  }

  function iniciarMusica(){
    if(musicaSilenciada) return;

    // Primer intento: probar si existe una canción propia junto al HTML
    if(!yaProbeExterno){
      yaProbeExterno = true;
      audioExterno.play().then(()=>{
        usandoExterno = true;
        musicaActiva = true;
        actualizarBotonMusica();
      }).catch(()=>{
        // No se encontró "cancion.mp3" (o el navegador la bloqueó): usamos la melodía compuesta
        iniciarMusicaSintetizada();
      });
      return;
    }

    if(usandoExterno){
      audioExterno.play().catch(()=>{ iniciarMusicaSintetizada(); });
      musicaActiva = true;
      actualizarBotonMusica();
    } else {
      iniciarMusicaSintetizada();
    }
  }

  function detenerMusica(){
    if(usandoExterno){
      audioExterno.pause();
    } else if(audioCtx && audioCtx.state === 'running'){
      audioCtx.suspend();
    }
    musicaActiva = false;
    actualizarBotonMusica();
  }

  botonMusica.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(musicaActiva){
      musicaSilenciada = true;
      detenerMusica();
    } else {
      musicaSilenciada = false;
      iniciarMusica();
    }
  });

  // Los navegadores exigen un gesto del usuario para reproducir audio:
  // arrancamos la música en el primer toque sobre la pantalla
  window.addEventListener('pointerdown', function primerToque(){
    iniciarMusica();
    window.removeEventListener('pointerdown', primerToque);
  }, { once:true });

  const reducMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Detección de móvil: bajamos la cantidad de partículas para mantener fluidez
  const esMovil = window.matchMedia('(max-width: 820px), (pointer:coarse)').matches;
  const factorRendimiento = esMovil ? 0.62 : 1;

  /* ---------------------------------------------------
     Texturas generadas por canvas (sin imágenes externas)
     --------------------------------------------------- */
  function texturaParticula(){
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(32,32,0,32,32,32);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(.35, 'rgba(255,225,160,.95)');
    g.addColorStop(1, 'rgba(255,180,60,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,64,64);
    return new THREE.CanvasTexture(c);
  }

  function texturaEstrella(){
    const c = document.createElement('canvas'); c.width = c.height = 32;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(16,16,0,16,16,16);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,32,32);
    return new THREE.CanvasTexture(c);
  }

  function texturaGirasol(opciones){
    opciones = opciones || {};
    const c = document.createElement('canvas'); c.width = c.height = 160;
    const ctx = c.getContext('2d');
    ctx.translate(80,80);
    const paletas = [
      ['#FFC93C','#FFE9A8'], ['#FFB627','#FFDD8A'], ['#FFDE59','#FFF2B0'],
      ['#F7B733','#FFE29A'], ['#FFCD3C','#FFAA00'], ['#FFA400','#FFD98A']
    ];
    const paleta = opciones.paleta || paletas[Math.floor(Math.random()*paletas.length)];
    const numPetalos = opciones.petalos || (9 + Math.floor(Math.random()*8));
    const anchoPetalo = 8 + Math.random()*9;
    const largoPetalo = 28 + Math.random()*16;
    const puntiagudo = Math.random() < 0.5;
    const giroExtra = Math.random()*Math.PI*2;
    for(let i=0;i<numPetalos;i++){
      ctx.save();
      ctx.rotate((Math.PI*2/numPetalos)*i + giroExtra);
      const grad = ctx.createLinearGradient(0,-largoPetalo,0,-4);
      grad.addColorStop(0, paleta[1]);
      grad.addColorStop(1, paleta[0]);
      ctx.fillStyle = grad;
      ctx.beginPath();
      if(puntiagudo){
        ctx.moveTo(0,-4);
        ctx.quadraticCurveTo(anchoPetalo, -largoPetalo*.55, 0, -largoPetalo);
        ctx.quadraticCurveTo(-anchoPetalo, -largoPetalo*.55, 0, -4);
      } else {
        ctx.ellipse(0,-largoPetalo*.6,anchoPetalo,largoPetalo*.5,0,0,Math.PI*2);
      }
      ctx.fill();
      ctx.restore();
    }
    const radioCentro = 18 + Math.random()*9;
    const gCentro = ctx.createRadialGradient(-6,-8,2,0,0,radioCentro);
    gCentro.addColorStop(0, opciones.centro || '#A9773A');
    gCentro.addColorStop(1, opciones.centro2 || '#6B4A1E');
    ctx.fillStyle = gCentro;
    ctx.beginPath(); ctx.arc(0,0,radioCentro,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.16)';
    for(let k=0;k<16;k++){
      const a = Math.random()*Math.PI*2, r = Math.random()*radioCentro*0.85;
      ctx.beginPath(); ctx.arc(Math.cos(a)*r, Math.sin(a)*r, 1.3, 0, Math.PI*2); ctx.fill();
    }
    return new THREE.CanvasTexture(c);
  }

  function texturaFlorSencilla(){
    const c = document.createElement('canvas'); c.width = c.height = 120;
    const ctx = c.getContext('2d');
    ctx.translate(60,60);
    const numPetalos = 5 + Math.floor(Math.random()*2);
    const colores = ['#FFF6DC','#FFE9A8','#FFD35C','#FFF0C4'];
    const color = colores[Math.floor(Math.random()*colores.length)];
    const largo = 19 + Math.random()*7;
    for(let i=0;i<numPetalos;i++){
      ctx.save();
      ctx.rotate((Math.PI*2/numPetalos)*i);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.ellipse(0,-largo,12,largo*.85,0,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
    const g = ctx.createRadialGradient(0,0,1,0,0,12);
    g.addColorStop(0,'#FFC93C'); g.addColorStop(1,'#B9790E');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,11,0,Math.PI*2); ctx.fill();
    return new THREE.CanvasTexture(c);
  }

  function texturaMargarita(){
    const c = document.createElement('canvas'); c.width = c.height = 120;
    const ctx = c.getContext('2d');
    ctx.translate(60,60);
    const numPetalos = 12 + Math.floor(Math.random()*4);
    const largo = 30 + Math.random()*8;
    for(let i=0;i<numPetalos;i++){
      ctx.save();
      ctx.rotate((Math.PI*2/numPetalos)*i);
      ctx.fillStyle = '#FFE9A8';
      ctx.beginPath();
      ctx.ellipse(0,-largo*.6,6,largo*.5,0,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
    const g = ctx.createRadialGradient(0,0,1,0,0,14);
    g.addColorStop(0,'#FFDE59'); g.addColorStop(1,'#FFA400');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,13,0,Math.PI*2); ctx.fill();
    return new THREE.CanvasTexture(c);
  }

  function texturaTulipan(){
    const c = document.createElement('canvas'); c.width = 90; c.height = 120;
    const ctx = c.getContext('2d');
    ctx.translate(45,105);
    const paletas = [['#FFC93C','#FFE9A8'],['#FFD35C','#FFF3D2'],['#FFB627','#FFDD8A'],['#FFDE59','#FFF6DC']];
    const paleta = paletas[Math.floor(Math.random()*paletas.length)];
    ctx.strokeStyle = '#3C7A3E'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,15); ctx.stroke();
    [[-16,0],[16,0],[0,-6]].forEach(([dx,dy])=>{
      ctx.save();
      ctx.translate(dx,dy);
      const g = ctx.createLinearGradient(0,-62,0,0);
      g.addColorStop(0, paleta[1]); g.addColorStop(1, paleta[0]);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.bezierCurveTo(-15,-28,-9,-56,0,-64);
      ctx.bezierCurveTo(9,-56,15,-28,0,0);
      ctx.fill();
      ctx.restore();
    });
    return new THREE.CanvasTexture(c);
  }

  function texturaRosa(){
    const c = document.createElement('canvas'); c.width = c.height = 130;
    const ctx = c.getContext('2d');
    ctx.translate(65,65);
    const paletas = [['#FFB627','#FFE9A8'],['#F7B733','#FFDD8A'],['#FFA400','#FFD98A']];
    const paleta = paletas[Math.floor(Math.random()*paletas.length)];
    const capas = 4;
    for(let capa=0; capa<capas; capa++){
      const radio = 12 + capa*8;
      const numPetalos = 5 + capa;
      for(let i=0;i<numPetalos;i++){
        ctx.save();
        ctx.rotate((Math.PI*2/numPetalos)*i + capa*0.4);
        const g = ctx.createLinearGradient(0,-radio-10,0,0);
        g.addColorStop(0, paleta[1]); g.addColorStop(1, paleta[0]);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(0,-radio,radio*0.55,radio*0.8,0,0,Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
    }
    return new THREE.CanvasTexture(c);
  }

  function texturaRamo(){
    const c = document.createElement('canvas'); c.width = 170; c.height = 210;
    const ctx = c.getContext('2d');
    ctx.translate(85,185);
    ctx.strokeStyle = '#4C8C4A'; ctx.lineWidth = 4;
    const tallos = [[-20,-72],[0,-94],[20,-72],[-9,-56],[11,-56]];
    tallos.forEach(([dx,dy])=>{
      ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(dx*0.5, dy*0.5, dx, dy); ctx.stroke();
    });
    ctx.fillStyle = '#FFD35C';
    ctx.beginPath(); ctx.ellipse(0,-4,17,10,0.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0,-4,17,10,-0.5,0,Math.PI*2); ctx.fill();
    const paletas = [['#FFC93C','#FFE9A8'],['#FFB627','#FFDD8A'],['#FFDE59','#FFF6DC']];
    tallos.forEach((p,i)=>{
      ctx.save();
      ctx.translate(p[0],p[1]);
      const paleta = paletas[i%3];
      const numPet = 6 + (i%3);
      for(let k=0;k<numPet;k++){
        ctx.save();
        ctx.rotate((Math.PI*2/numPet)*k);
        const g = ctx.createLinearGradient(0,-16,0,0);
        g.addColorStop(0,paleta[1]); g.addColorStop(1,paleta[0]);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.ellipse(0,-10,4.5,9,0,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = i%3===2 ? '#FFC93C' : '#A9773A';
      ctx.beginPath(); ctx.arc(0,0,4.5,0,Math.PI*2); ctx.fill();
      ctx.restore();
    });
    return new THREE.CanvasTexture(c);
  }

  function texturaBandaAnillo(){
    const c = document.createElement('canvas'); c.width = 8; c.height = 128;
    const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0,0,0,128);
    g.addColorStop(0,'rgba(255,255,255,0)');
    g.addColorStop(0.5,'rgba(255,255,255,1)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,8,128);
    return new THREE.CanvasTexture(c);
  }

  function texturaArbolito(){
    const c = document.createElement('canvas'); c.width = 110; c.height = 140;
    const ctx = c.getContext('2d');
    ctx.translate(55,132);
    ctx.fillStyle = '#7A5225';
    ctx.fillRect(-4,-42,8,42);
    const g = ctx.createRadialGradient(0,-72,4,0,-72,46);
    g.addColorStop(0,'#FFDE59'); g.addColorStop(1,'#C98A1E');
    ctx.fillStyle = g;
    [[-19,-58,21],[19,-58,21],[0,-82,27],[-11,-42,17],[11,-42,17],[0,-56,24]].forEach(([x,y,r])=>{
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    });
    return new THREE.CanvasTexture(c);
  }

  function texturaCorazonMini(){
    const c = document.createElement('canvas'); c.width = c.height = 80;
    const ctx = c.getContext('2d');
    ctx.translate(40,46);
    ctx.beginPath();
    ctx.moveTo(0,20);
    ctx.bezierCurveTo(-35,-10,-22,-34,0,-12);
    ctx.bezierCurveTo(22,-34,35,-10,0,20);
    const g = ctx.createRadialGradient(0,-4,2,0,-4,34);
    g.addColorStop(0,'#FFF3D2'); g.addColorStop(1,'#FFA400');
    ctx.fillStyle = g;
    ctx.fill();
    return new THREE.CanvasTexture(c);
  }

  function texturaTexto(texto){
    const c = document.createElement('canvas');
    c.width = 560; c.height = 150;
    const ctx = c.getContext('2d');
    ctx.font = "600 62px 'Caveat', cursive";
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(255,201,60,.95)';
    ctx.shadowBlur = 22;
    ctx.fillStyle = '#FFF3D2';
    ctx.fillText(texto, 280, 78);
    ctx.fillText(texto, 280, 78);
    return new THREE.CanvasTexture(c);
  }

  /* ---------------------------------------------------
     Escena, cámara, render
     --------------------------------------------------- */
  const escena = new THREE.Scene();
  escena.fog = new THREE.FogExp2(0x05040f, 0.0016);

  const CAMARA_DESTINO = new THREE.Vector3(0, 14, 230);
  const CAMARA_ORIGEN = new THREE.Vector3(0, 70, 3050);
  const FOV_DESTINO = 52;
  const FOV_ORIGEN = 100;

  const camara = new THREE.PerspectiveCamera(FOV_DESTINO, innerWidth/innerHeight, .1, 4200);
  camara.position.copy(CAMARA_DESTINO);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, esMovil ? 1.5 : 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x05040f, 1);

  const controls = new THREE.OrbitControls(camara, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = .06;
  controls.minDistance = 70;
  controls.maxDistance = 430;
  controls.autoRotate = !reducMotion;
  controls.autoRotateSpeed = 0.55;
  controls.target.set(0,0,0);
  controls.enablePan = true;
  controls.screenSpacePanning = true;

  let introActiva = false;
  let introInicio = 0;
  let introCB = null;
  let tunel = null;

  function suaviza(x,a,b){
    const k = Math.min(1, Math.max(0, (x-a)/(b-a)));
    return k*k*(3-2*k);
  }

  window.addEventListener('resize', ()=>{
    camara.aspect = innerWidth/innerHeight;
    camara.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  /* ---------------------------------------------------
     Corazón de partículas
     --------------------------------------------------- */
  function puntoCorazon(t){
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
    return { x, y };
  }

  // Curva de una flor de 6 pétalos (curva rosa), usada para el reacomodo periódico
  const PETALOS_FLOR = 6;
  function radioFlor(theta){
    return 0.4 + 0.6*Math.pow(Math.abs(Math.cos(PETALOS_FLOR*theta/2)), 0.85);
  }

  const CICLO_FORMA = 18;      // segundos totales del ciclo corazón -> flor -> corazón
  const T_MORPH = 3;
  const T_HOLD_CORAZON = 8;
  const T_HOLD_FLOR = 4;
  function calcularMezclaFlor(t){
    const ct = t % CICLO_FORMA;
    if(ct < T_HOLD_CORAZON) return 0;
    if(ct < T_HOLD_CORAZON+T_MORPH){
      const f = (ct-T_HOLD_CORAZON)/T_MORPH;
      return f*f*(3-2*f);
    }
    if(ct < T_HOLD_CORAZON+T_MORPH+T_HOLD_FLOR) return 1;
    const f = (ct-(T_HOLD_CORAZON+T_MORPH+T_HOLD_FLOR))/T_MORPH;
    return 1-(f*f*(3-2*f));
  }

  const ESCALA_CORAZON = 5.6;
  const colorCentro = new THREE.Color('#FFF6DC');
  const colorBorde = new THREE.Color('#FFA400');

  /* Registro de capas de partículas con vida propia:
     cada partícula guarda su posición base + una fase/velocidad
     propia para vibrar de forma orgánica, sin perder la forma. */
  const capasVivas = [];
  function registrarVida(puntos, N, ampBase, baseFlor){
    const fase = new Float32Array(N);
    const vel = new Float32Array(N);
    const amp = new Float32Array(N);
    for(let i=0;i<N;i++){
      fase[i] = Math.random()*Math.PI*2;
      vel[i] = .5 + Math.random()*1.1;
      amp[i] = ampBase*(.5 + Math.random());
    }
    const base = puntos.geometry.attributes.position.array.slice();
    capasVivas.push({ puntos, base, baseFlor, fase, vel, amp, N });
  }

  const ESCALA_FLOR = 84;

      const x = p.x*ESCALA_CORAZON + (Math.random()-.5)*jitter;
      const y = p.y*ESCALA_CORAZON + (Math.random()-.5)*jitter;
      const z = (Math.random()-.5)*10;
      pos[i*3] = x; pos[i*3+1] = y; pos[i*3+2] = z;
      const f = Math.min(1, Math.hypot(x,y)/70);
      const c = colorCentro.clone().lerp(colorBorde, f);
      col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;

      const theta = Math.random()*Math.PI*2;
      const r = radioFlor(theta)*ESCALA_FLOR;
      posFlor[i*3]   = Math.cos(theta)*r + (Math.random()-.5)*jitter;
      posFlor[i*3+1] = Math.sin(theta)*r + (Math.random()-.5)*jitter + 4;
      posFlor[i*3+2] = (Math.random()-.5)*10;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
    geo.setAttribute('color', new THREE.BufferAttribute(col,3));
    const mat = new THREE.PointsMaterial({
      size: 2.6, map: texturaParticula(), vertexColors:true,

  /* ---------------------------------------------------
     Estrellas de fondo — varias capas para dar profundidad real
     --------------------------------------------------- */
  const capasEstrellas = [];
  function crearCapaEstrellas(N, rMin, rMax, tamano, opacidad, velRotacion){
    const pos = new Float32Array(N*3);
    const col = new Float32Array(N*3);
    const fase = new Float32Array(N);
    const vel = new Float32Array(N);
    for(let i=0;i<N;i++){
      const r = rMin + Math.random()*(rMax-rMin);
      const theta = Math.random()*Math.PI*2;
      const phi = Math.acos((Math.random()*2)-1);
      pos[i*3] = r*Math.sin(phi)*Math.cos(theta);
      pos[i*3+1] = r*Math.sin(phi)*Math.sin(theta);
      pos[i*3+2] = r*Math.cos(phi);
      const calidez = Math.random();
      col[i*3] = 1;
      col[i*3+1] = 0.9 + calidez*0.07;
      col[i*3+2] = 0.78 + calidez*0.2;
      fase[i] = Math.random()*Math.PI*2;
      vel[i] = .5 + Math.random()*1.8;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
    geo.setAttribute('color', new THREE.BufferAttribute(col,3));
    const mat = new THREE.PointsMaterial({
      size:tamano, map: texturaEstrella(), vertexColors:true,
      transparent:true, opacity:opacidad, depthWrite:false, sizeAttenuation:true
    });
    const puntos = new THREE.Points(geo, mat);
    escena.add(puntos);
    capasEstrellas.push({ puntos, base: col.slice(), fase, vel, velRotacion });
  }

  /* ---------------------------------------------------

  const anillosOrbita = [];
  function crearAnilloOrbita(radio, grosor, inclinacion, colorHex, N, vel){

    });

    obj.rotation.x = inclinacion;
    obj.position.y = 4;

  // Banda de resplandor detrás de cada anillo: los hace visibles de un vistazo,
  // incluso en pantallas pequeñas de móvil
  function crearBandaAnillo(radio, grosor, inclinacion, colorHex, opacidad, vel){
    const geo = new THREE.RingGeometry(radio-grosor*1.6, radio+grosor*1.6, 128, 1);
    const mat = new THREE.MeshBasicMaterial({

    });

    obj.position.y = 4;
    escena.add(obj);

  crearBandaAnillo(148, 10, Math.PI/2.5, 0xFFE9A8, reducMotion?.35:.5, reducMotion?0:0.05);

  function posEsferica(rMin, rMax, alturaMin, alturaMax){

    const y = alturaMin + Math.random()*(alturaMax-alturaMin);
    return new THREE.Vector3(Math.cos(theta)*r, y, Math.sin(theta)*r);
  }

  const mensajes = [

  /* ---------------------------------------------------
     Estallidos al tocar
     --------------------------------------------------- */
  const estallidos = [];
  function crearEstallido(punto){
    const N = 90;
    const pos = new Float32Array(N*3);
    const vel = [];
    for(let i=0;i<N;i++){
      pos[i*3]=punto.x; pos[i*3+1]=punto.y; pos[i*3+2]=punto.z;
      const dir = new THREE.Vector3((Math.random()-.5), (Math.random()-.5), (Math.random()-.5)).normalize();
      const spd = 20 + Math.random()*40;
      vel.push(dir.multiplyScalar(spd));
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
    const mat = new THREE.PointsMaterial({
      size:3.2, map: texturaParticula(), color:0xFFD35C,
      transparent:true, opacity:1, depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true
    });
    const puntos = new THREE.Points(geo, mat);
    escena.add(puntos);
    estallidos.push({ puntos, vel, vida:0, max:1.1 });
  }

  /* ---------------------------------------------------
     Túnel de agujero de gusano (para el vuelo de cámara inicial)
     --------------------------------------------------- */
  function construirTunel(){
    const grupo = new THREE.Group();
    const anillos = [];
    const numAnillos = 24;
    for(let i=0;i<numAnillos;i++){
      const zRef = 260 + i*112;
      const radio = 95 + Math.sin(i*0.7)*14;
      const N = Math.round(100*factorRendimiento);
      const pos = new Float32Array(N*3);
      for(let j=0;j<N;j++){
        const ang = (j/N)*Math.PI*2 + Math.random()*0.05;
        pos[j*3]   = Math.cos(ang)*radio + (Math.random()-.5)*4;
        pos[j*3+1] = Math.sin(ang)*radio*0.5 + 20 + (Math.random()-.5)*4;
        pos[j*3+2] = zRef + (Math.random()-.5)*6;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
      const calido = i%2===0;
      const baseOpac = .5;
      const mat = new THREE.PointsMaterial({
        size: 3.4, map: texturaParticula(),
        color: calido ? 0xFFC93C : 0xFFF3D2,
        transparent:true, opacity: baseOpac, depthWrite:false,
        blending: THREE.AdditiveBlending, sizeAttenuation:true
      });
      const obj = new THREE.Points(geo, mat);
      grupo.add(obj);
      anillos.push({ obj, zRef, baseOpac, velRot: (Math.random()<0.5?1:-1)*(0.2+Math.random()*0.35) });
    }

    // Flores flotando dentro del túnel, mezcladas con las estrellas,
    // como si fueran parte del espacio mismo
    const flores = [];
    const fabricasFlorTunel = [texturaGirasol, texturaFlorSencilla, texturaMargarita, texturaTulipan, texturaRosa];
    const numFlores = Math.round(50 * factorRendimiento);
    for(let i=0;i<numFlores;i++){
      const zRef = 220 + Math.random()*2780;
      const radio = 30 + Math.random()*115;
      const ang = Math.random()*Math.PI*2;
      const fabrica = fabricasFlorTunel[Math.floor(Math.random()*fabricasFlorTunel.length)];
      const mat = new THREE.SpriteMaterial({
        map: fabrica(), transparent:true, depthWrite:false, blending: THREE.AdditiveBlending
      });
      const s = new THREE.Sprite(mat);
      const tam = 9 + Math.random()*17;
      s.scale.set(tam, tam, 1);
      s.position.set(
        Math.cos(ang)*radio,
        Math.sin(ang)*radio*0.5 + 20 + (Math.random()-.5)*40,
        zRef
      );
      grupo.add(s);
      flores.push({
        obj:s, zRef, baseOpac: .55 + Math.random()*.4,
        giro: (Math.random()<0.5?1:-1)*(0.15+Math.random()*.35)
      });
    }

    return { grupo, anillos, flores };
  }

  function iniciarViaje(cb){
    if(reducMotion){
      camara.position.copy(CAMARA_DESTINO);
      camara.lookAt(0,4,0);
      controls.target.set(0,0,0);
      controls.update();
      cb();
      return;
    }
    tunel = construirTunel();
    escena.add(tunel.grupo);
    camara.position.copy(CAMARA_ORIGEN);
    camara.fov = FOV_ORIGEN;
    camara.updateProjectionMatrix();
    controls.enabled = false;
    introCB = cb;
    introInicio = reloj.getElapsedTime();
    introActiva = true;
  }


  const rayo = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  let bajadaPos = null;

  function manejarTap(clientX, clientY){
    if(introActiva) return;
    ndc.x = (clientX/innerWidth)*2 - 1;
    ndc.y = -(clientY/innerHeight)*2 + 1;
    rayo.setFromCamera(ndc, camara);
    const hits = rayo.intersectObject(zonaTactil);
    if(hits.length){
      crearEstallido(hits[0].point);
    } else {
      const hitsFlor = rayo.intersectObjects(flotantes.map(f=>f.obj));
      if(hitsFlor.length){
        crearEstallido(hitsFlor[0].point);
      }
    }
    elPista.classList.add('ocultar');
  }

  renderer.domElement.addEventListener('pointerdown', (e)=>{ bajadaPos = {x:e.clientX, y:e.clientY}; });
  renderer.domElement.addEventListener('pointerup', (e)=>{
    if(!bajadaPos) return;
    const dx = e.clientX-bajadaPos.x, dy = e.clientY-bajadaPos.y;
    if(Math.hypot(dx,dy) < 6) manejarTap(e.clientX, e.clientY);
    bajadaPos = null;
  });

  /* ---------------------------------------------------
     Animación
     --------------------------------------------------- */
  const reloj = new THREE.Clock();

  function animar(){
    requestAnimationFrame(animar);
    const t = reloj.getElapsedTime();
    const dt = Math.min(reloj.getDelta(), .05);

    if(introActiva){
      const DURACION = 3.4;
      const p = Math.min(1, (t-introInicio)/DURACION);
      const suav = 1 - Math.pow(1-p, 3);
      camara.position.lerpVectors(CAMARA_ORIGEN, CAMARA_DESTINO, suav);
      const tambaleo = (1-suav)*(1-suav);
      camara.position.x += Math.sin(t*9)*6*tambaleo;
      camara.position.y += Math.cos(t*7)*4*tambaleo;
      camara.fov = FOV_ORIGEN + (FOV_DESTINO-FOV_ORIGEN)*suav;
      camara.updateProjectionMatrix();
      camara.lookAt(0,4,0);

      if(tunel){
        tunel.anillos.forEach(a=>{
          a.obj.rotation.z += dt*a.velRot;
          a.obj.material.opacity = a.baseOpac * suaviza(camara.position.z, a.zRef-90, a.zRef+90);
        });
        tunel.flores.forEach(f=>{
          f.obj.material.opacity = f.baseOpac * suaviza(camara.position.z, f.zRef-150, f.zRef+150);
          f.obj.material.rotation += dt*f.giro;
        });
      }

      if(p >= 1){
        introActiva = false;
        if(tunel){
          escena.remove(tunel.grupo);
          tunel.anillos.forEach(a=>{ a.obj.geometry.dispose(); a.obj.material.dispose(); });
          tunel.flores.forEach(f=>{ f.obj.material.map.dispose(); f.obj.material.dispose(); });
          tunel = null;
        }
        camara.position.copy(CAMARA_DESTINO);
        camara.fov = FOV_DESTINO;
        camara.updateProjectionMatrix();
        controls.target.set(0,0,0);
        controls.enabled = true;
        controls.update();
        if(introCB){ const f = introCB; introCB = null; f(); }
      }
    }

    grupoCorazon.scale.setScalar(1 + Math.sin(t*1.3)*0.035);
    if(!reducMotion) grupoCorazon.rotation.y = Math.sin(t*.18)*.06;
    nucleo.material.opacity = .75 + Math.sin(t*2.2)*.2;

    // Vida propia de las partículas del corazón: laten, vibran, y cada cierto
    // tiempo se reacomodan para formar una flor (y luego vuelven al corazón)
    const mezcla = calcularMezclaFlor(t);
    for(let c=0;c<capasVivas.length;c++){
      const capa = capasVivas[c];
      const pos = capa.puntos.geometry.attributes.position.array;
      for(let i=0;i<capa.N;i++){
        const i3 = i*3;
        let bx = capa.base[i3], by = capa.base[i3+1], bz = capa.base[i3+2];
        if(capa.baseFlor){
          bx += (capa.baseFlor[i3]  -bx)*mezcla;
          by += (capa.baseFlor[i3+1]-by)*mezcla;
          bz += (capa.baseFlor[i3+2]-bz)*mezcla;
        }
        const osc = Math.sin(t*capa.vel[i] + capa.fase[i]) * capa.amp[i];
        pos[i3]   = bx + osc;
        pos[i3+1] = by + Math.sin(t*capa.vel[i]*.8 + capa.fase[i]+1.7) * capa.amp[i];
        pos[i3+2] = bz + Math.cos(t*capa.vel[i]*.6 + capa.fase[i]) * capa.amp[i];
      }
      capa.puntos.geometry.attributes.position.needsUpdate = true;
    }

    // Parpadeo suave de las estrellas + rotación lentísima (paralaje)
    capasEstrellas.forEach(capa=>{
      capa.puntos.rotation.y += dt*capa.velRotacion;
      const col = capa.puntos.geometry.attributes.color.array;
      for(let i=0;i<capa.fase.length;i++){
        const br = .5 + .5*Math.sin(t*capa.vel[i] + capa.fase[i]);
        const i3 = i*3;
        col[i3]   = capa.base[i3]   * br;
        col[i3+1] = capa.base[i3+1] * br;
        col[i3+2] = capa.base[i3+2] * br;
      }
      capa.puntos.geometry.attributes.color.needsUpdate = true;
    });

    // Anillos orbitales alrededor del corazón
    anillosOrbita.forEach(a=>{ a.obj.rotation.y += dt*a.vel; });

    flotantes.forEach(f=>{
      f.obj.position.y = f.base.y + Math.sin(t*f.vel + f.fase)*f.amp;
      f.obj.position.x = f.base.x + Math.sin(t*f.vel*.5 + f.fase*1.3)*f.amp*.4;
    });

    for(let i=estallidos.length-1;i>=0;i--){
      const e = estallidos[i];
      e.vida += dt;
      const pos = e.puntos.geometry.attributes.position.array;
      for(let j=0;j<e.vel.length;j++){
        pos[j*3]   += e.vel[j].x*dt;
        pos[j*3+1] += e.vel[j].y*dt - dt*14*e.vida;
        pos[j*3+2] += e.vel[j].z*dt;
      }
      e.puntos.geometry.attributes.position.needsUpdate = true;
      e.puntos.material.opacity = Math.max(0, 1 - e.vida/e.max);
      if(e.vida >= e.max){
        escena.remove(e.puntos);
        e.puntos.geometry.dispose();
        e.puntos.material.dispose();
        estallidos.splice(i,1);
      }
    }

    if(!introActiva) controls.update();
    renderer.render(escena, camara);
  }

  function iniciar(){
    requestAnimationFrame(()=>{
      capaCarga.classList.add('oculto');
    });
    animar();
    iniciarViaje(()=>{
      elTitulo.classList.add('mostrar');
      elPista.classList.add('mostrar');
      setTimeout(()=> elPista.classList.add('ocultar'), 5200);
    });
  }

  if(document.fonts && document.fonts.ready){
    document.fonts.load("600 62px 'Caveat'").then(()=> document.fonts.ready).then(iniciar).catch(iniciar);
  } else {
    iniciar();
  }

})();
</script>
